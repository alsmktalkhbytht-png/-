<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>BIOS Intro</title>
<style>
@font-face{font-family:Mada;src:url(fonts/Mada-Medium.ttf);font-weight:500}
@font-face{font-family:Mada;src:url(fonts/Mada-Bold.ttf);font-weight:700}
@font-face{font-family:Mada;src:url(fonts/Mada-Black.ttf);font-weight:900}
@font-face{font-family:Amiri;src:url(fonts/AmiriQuran-Regular.ttf)}
@font-face{font-family:Playfair;src:url(fonts/playfair-display-latin-700-italic.woff2);font-style:italic;font-weight:700}
:root{--wine:#6e1a22;--wine2:#8f2a33;--sage:#7d8478;--ink:#3b2a2a;--cream:#efe8df;--gold:#b59a6a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#140c0c}
#stage{position:absolute;inset:0;overflow:hidden;background:#140c0c}
#bgblur{position:absolute;inset:-80px;background:url(logo.jpg) center/cover;filter:blur(40px) saturate(.9);opacity:0}
#paper{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(239,232,223,.0) 40%,rgba(30,14,14,.55) 100%)}
#hero{position:absolute;left:50%;top:50%;width:1620px;height:1080px;transform-origin:50% 50%;will-change:transform,filter,clip-path}
#hero img{width:100%;height:100%;display:block}
#shine{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
  background:linear-gradient(105deg,transparent 0%,transparent 42%,rgba(255,250,235,.95) 50%,transparent 58%,transparent 100%);
  background-size:260% 100%;background-position:120% 0;opacity:0}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(255,246,230,1),rgba(255,246,230,0) 60%);opacity:0;mix-blend-mode:screen}
#streak{position:absolute;left:0;top:50%;height:4px;width:100%;transform-origin:50% 50%;
  background:linear-gradient(90deg,transparent,rgba(181,154,106,.2) 20%,#f3dcc0 50%,rgba(181,154,106,.2) 80%,transparent);
  box-shadow:0 0 30px 6px rgba(240,200,160,.55),0 0 90px 20px rgba(143,42,51,.45);opacity:0}
canvas#fx{position:absolute;inset:0}
#veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(239,232,223,0) 0%,rgba(239,232,223,0) 52%,rgba(239,232,223,.94) 74%,#efe8df 100%);opacity:0}
#credits{position:absolute;left:0;right:0;bottom:78px;display:flex;justify-content:center;gap:120px;direction:rtl}
.card{text-align:center;opacity:0;will-change:transform,opacity,filter,clip-path}
.lab{font:500 40px Mada;color:var(--sage);letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:18px}
.lab:before,.lab:after{content:"";width:70px;height:2px;background:linear-gradient(90deg,transparent,var(--gold))}
.lab:after{transform:scaleX(-1)}
.names{margin-top:6px;font:900 78px Mada;color:var(--wine);line-height:1.25;text-shadow:0 2px 0 rgba(255,255,255,.6),0 10px 30px rgba(110,26,34,.18)}
.names .amp{color:var(--gold);font-weight:700;margin:0 16px}
.diamond{display:inline-block;width:12px;height:12px;background:var(--wine);transform:rotate(45deg);margin:0 22px;vertical-align:middle}
#sep{position:absolute;bottom:96px;left:50%;width:2px;height:150px;background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:0}
#tag{position:absolute;left:0;right:0;bottom:26px;text-align:center;font:700 italic 24px Playfair;color:var(--sage);letter-spacing:10px;opacity:0}
#fade{position:absolute;inset:0;background:#140c0c;opacity:1}
</style>
</head>
<body>
<div id="stage">
  <div id="bgblur"></div>
  <div id="hero"><img src="logo.jpg" alt="BIOS — Lecture Translation"><div id="shine"></div></div>
  <div id="paper"></div>
  <div id="flash"></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="streak"></div>
  <div id="veil"></div>
  <div id="tag">TELEGRAM · @BIOS0t</div>
  <div id="sep"></div>
  <div id="credits">
    <div class="card" id="c1">
      <div class="lab">بإدارة</div>
      <div class="names">محمد حامد<span class="amp">و</span>عبد الله خالد</div>
    </div>
    <div class="card" id="c2">
      <div class="lab">إنشاء الفيديو بواسطة</div>
      <div class="names">عبدالقهار حسيب</div>
    </div>
  </div>
  <div id="fade"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=t=>1-Math.pow(1-t,3);                    // ease out cubic
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; // ease in-out
const back=t=>{const c=1.4;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};

// deterministic particles
let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
const P=Array.from({length:140},()=>({x:rnd()*1920,y:1080+rnd()*500,v:60+rnd()*160,r:1+rnd()*3.2,
  w:rnd()*6.28,a:.25+rnd()*.6,c:rnd()<.55?'243,220,192':(rnd()<.5?'181,154,106':'160,50,60')}));
const B=Array.from({length:70},()=>({ang:rnd()*6.28,sp:300+rnd()*900,r:1.2+rnd()*2.6,c:rnd()<.6?'250,232,205':'190,80,90'}));
const fx=$('fx').getContext('2d');

window.render=function(t){
  // fade from black
  $('fade').style.opacity = t<9.3 ? 1-eo(seg(t,0.0,0.5))*1 : eio(seg(t,9.3,10));
  if(t<0.5) $('fade').style.opacity=1-eo(seg(t,0,0.5));

  // light streak
  const st=seg(t,0.35,1.15), sc=seg(t,1.15,1.7);
  $('streak').style.opacity = t<1.15 ? eo(st) : 1-eo(sc);
  $('streak').style.transform=`scaleX(${lerp(0.02,1,eo(st))}) scaleY(${lerp(1,40,eo(sc))})`;

  // hero reveal
  const r=seg(t,1.15,2.3), push=seg(t,2.3,5.4), out=seg(t,5.4,6.3);
  const open=eio(r);
  let scale=lerp(1.22,1.06,eo(r)); scale=lerp(scale,1.0,eio(push));
  const outS=lerp(1,0.70,eio(out)), outY=lerp(0,-168,eio(out));
  $('hero').style.transform=`translate(-50%,-50%) translateY(${outY}px) scale(${scale*outS})`;
  $('hero').style.filter=`blur(${lerp(14,0,eo(r))}px) brightness(${lerp(1.8,1,eo(r))})`;
  $('hero').style.clipPath=`inset(${lerp(50,0,open)}% 0 ${lerp(50,0,open)}% 0 round ${lerp(0,26,eio(out))}px)`;
  $('hero').style.boxShadow=`0 30px 80px rgba(0,0,0,${0.45*eio(out)})`;
  $('bgblur').style.opacity=lerp(0,0.75,open);
  $('flash').style.opacity= t<1.15?0: (t<1.5? eo(seg(t,1.15,1.35)) : 1-eo(seg(t,1.35,2.2)));

  // shine sweeps
  const sh1=seg(t,2.2,3.2), sh2=seg(t,4.3,5.1);
  const sh = sh1>0&&sh1<1 ? sh1 : (sh2>0&&sh2<1 ? sh2 : -1);
  $('shine').style.opacity= sh<0?0:Math.sin(sh*Math.PI);
  $('shine').style.backgroundPosition=`${lerp(120,-20,sh<0?0:sh)}% 0`;

  // veil + credits
  $('veil').style.opacity=eio(seg(t,5.5,6.4));
  $('sep').style.opacity=eo(seg(t,6.9,7.6))*(1-seg(t,9.2,9.6));
  $('sep').style.transform=`translateX(-50%) scaleY(${eo(seg(t,6.9,7.6))})`;
  $('tag').style.opacity=eo(seg(t,6.2,7.0))*0.9;
  $('tag').style.letterSpacing=lerp(26,10,eo(seg(t,6.2,7.4)))+'px';
  [['c1',6.1],['c2',7.0]].forEach(([id,a])=>{
    const k=seg(t,a,a+0.9), e=eo(k);
    const el=$(id);
    el.style.opacity=e;
    el.style.transform=`translateY(${lerp(40,0,back(k))}px) scale(${lerp(.92,1,e)})`;
    el.style.filter=`blur(${lerp(10,0,e)}px)`;
    el.style.clipPath=`inset(0 0 0 ${lerp(100,0,eio(k))}%)`;
  });

  // particles + burst
  fx.clearRect(0,0,1920,1080);
  if(t>1.1){
    const pt=t-1.1, fadeOut=1-seg(t,9.2,9.8);
    P.forEach(p=>{
      const y=p.y-p.v*pt*1.0, x=p.x+Math.sin(p.w+pt*1.3)*22;
      const yy=((y%1600)+1600)%1600-260;
      const tw=.6+.4*Math.sin(p.w*3+pt*4);
      fx.fillStyle=`rgba(${p.c},${p.a*tw*fadeOut*eo(seg(t,1.1,2))})`;
      fx.beginPath();fx.arc(x,yy,p.r,0,6.283);fx.fill();
    });
  }
  const bt=seg(t,1.2,2.4);
  if(bt>0&&bt<1){
    B.forEach(b=>{
      const d=eo(bt)*b.sp, x=960+Math.cos(b.ang)*d, y=500+Math.sin(b.ang)*d*0.6;
      fx.fillStyle=`rgba(${b.c},${1-bt})`;fx.beginPath();fx.arc(x,y,b.r*(1.4-bt),0,6.283);fx.fill();
    });
  }
};
render(0);
</script>
</body>
</html>
